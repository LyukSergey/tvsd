spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop
    username: shop
    password: shop

  jpa:
    hibernate:
      ddl-auto: create          # перестворювати таблиці під усі сутності при старті
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
