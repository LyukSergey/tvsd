spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shop
    username: shop
    password: shop

  jpa:
    hibernate:
      # create-drop: створити таблиці при старті й видалити при зупинці.
      # Для демонстрації CRUD зручно — щоразу чиста таблиця.
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
