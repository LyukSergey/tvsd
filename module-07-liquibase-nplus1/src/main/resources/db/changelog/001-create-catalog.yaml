# ChangeSet 001: таблиці каталогу — categories та products.
# Кожен changeSet має ОБОВʼЯЗКОВІ id та author (разом вони унікально його ідентифікують).
databaseChangeLog:
  - changeSet:
      id: 001-create-categories
      author: course
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
      # Секція rollback — як відкотити цей changeSet (Liquibase часто вміє сам,
      # але для createTable корисно показати явно).
      rollback:
        - dropTable:
            tableName: categories

  - changeSet:
      id: 001-create-products
      author: course
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: bigint
        # Зовнішній ключ products.category_id -> categories.id
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category
      rollback:
        - dropTable:
            tableName: products
