# Головний журнал змін Liquibase. Підключає окремі файли changeSets ПО ПОРЯДКУ.
# При старті застосунку Liquibase:
#   1) створює службові таблиці DATABASECHANGELOG та DATABASECHANGELOGLOCK (якщо їх немає);
#   2) дивиться, які changeSets уже застосовані (за id+author);
#   3) застосовує лише нові, у вказаному порядку.
databaseChangeLog:
  - include:
      file: db/changelog/001-create-catalog.yaml
  - include:
      file: db/changelog/002-create-orders.yaml
  - include:
      file: db/changelog/003-add-indexes.yaml
